

name :
    Python Tests

on :
    push:
    pull_request:

jobs :
    test:
        runs-on : ubuntu-latest

        steps :

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
               python-version: "3.14"

            - name: Install pytest
              run: python -m pip install pytest

            - name : Run tests
              run: pytest -v
              continue-on-error: true

            - name: Build Docker image
              run: docker build -t game-data-testing .

            - name: Run Docker container
              run: docker run --rm game-data-testing